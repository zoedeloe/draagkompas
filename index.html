
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draagkompas</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">

  <style>
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background:#0f0b3a;
      color:#fff;
      font-family: Montserrat, system-ui, sans-serif;
    }

    :root{
      --floating-h:110px;
      --line:rgba(255,255,255,0.15);
      --muted:#cfd3ff;
      --card:#15104a;
      --panel:#1b165c;
      --accent:#ff7a59;
      --accent-ink:#1a1446;
    }

    /* ICONEN */
    .floating-icon,
    .floating-text{
      position:absolute;
      top:20px;
      z-index:100;
      display:none;
    }
    .floating-icon{ left:20px; }
    .floating-text{ right:20px; }

    body.show-icon .floating-icon,
    body.show-icon .floating-text{ display:block; }

    .floating-icon img,
    .floating-text img{
      height:var(--floating-h);
      width:auto;
      display:block;
    }

    .screen{
      display:none;
      min-height:100svh;
      padding:16px;
    }
    .screen.active{ display:block; }

    #screen-3,
    #screen-4-zoek,
    #screen-4-vergelijk,
    #screen-5-results{
      padding-top:150px !important;
    }

    @media(max-width:720px){
      #screen-3,
      #screen-4-zoek,
      #screen-4-vergelijk,
      #screen-5-results{
        padding-top:180px !important;
      }
    }

    .nav-row{
      display:flex; gap:12px; justify-content:space-between;
      margin-top:12px;
    }
    .btn{
      border:none; padding:14px 22px; border-radius:12px;
      font-weight:800; cursor:pointer;
    }
    .btn-primary{ background:var(--accent); color:var(--accent-ink); }
    .btn-secondary{ background:#2a246f; color:#fff; }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; }

    #btn-back-1{ display:none!important; }
    .screen1-wrapper{
      display:grid; place-items:center;
      min-height:100svh;
    }
    .intro-inner{
      display:grid; gap:24px; justify-items:center;
      max-width:1100px;
    }
    .intro-logo{
      width:min(95%,1100px);
      height:auto;
      display:block;
    }

    .screen2-wrapper{
      max-width:1100px; margin:0 auto;
      display:grid; gap:20px;
    }
    .screen2-image{
      width:100%;
      border-radius:12px;
      box-shadow:0 8px 28px rgba(0,0,0,.35);
      display:block;
    }

    .screen3-wrapper{
      max-width:1100px; margin:0 auto;
      display:grid; gap:28px;
    }
    .choice-grid{
      display:grid; gap:20px;
      grid-template-columns:repeat(2,1fr);
    }
    @media(max-width:700px){
      .choice-grid{ grid-template-columns:1fr; }
    }
    .choice-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:28px;
      display:grid; gap:18px;
      cursor:pointer;
    }
    .choice-icon{ font-size:40px; }
    .choice-title{
      font-size:28px;
      font-weight:800;
      color:#fff;
    }
    .choice-sub{ color:var(--muted); }

    .filters-wrapper{
      max-width:1100px; margin:0 auto;
      display:grid; gap:20px;
    }

    .filters-section{ display:grid; gap:16px; }

    .group{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px; padding:14px;
    }

    .group-header{
      display:flex; justify-content:space-between;
      margin-bottom:10px;
    }

    .group-title{ font-weight:800; }

    .badge{
      border:1px solid var(--line);
      padding:2px 6px;
      border-radius:999px;
      font-size:11px;
      color:var(--muted);
    }

    .results-wrapper{
      max-width:900px; margin:0 auto;
      display:grid; gap:16px;
    }
    .results-summary{
      background:#201a6b;
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
    }
  </style>
</head>

<body>

<main id="app">

  <!-- ICONEN -->
  <div class="floating-icon">
    <img src="assets/img/header-icon.png" alt="">
  </div>

  <div class="floating-text">
    <img src="assets/img/header-text.png" alt="">
  </div>

  <!-- SCHERM 1 -->
  <section id="screen-1" class="screen active">
    <div class="screen1-wrapper">
      <div class="intro-inner">
        <img src="assets/img/logo.png" class="intro-logo" alt="">
        <div class="nav-row">
          <button id="btn-back-1" class="btn btn-secondary">TERUG</button>
          <button id="btn-next-1" class="btn btn-primary">VERDER</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SCHERM 2 -->
  <section id="screen-2" class="screen">
    <div class="screen2-wrapper">
      <figure>
        <img src="assets/img/draagkompas-disclaimer.png" class="screen2-image" alt="">
      </figure>
      <div class="nav-row">
        <button id="btn-back-2" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-2" class="btn btn-primary">VERDER</button>
      </div>
    </div>
  </section>

  <!-- SCHERM 3 -->
  <section id="screen-3" class="screen">
    <div class="screen3-wrapper">

      <div class="choice-grid">

        <button id="card-zoek" class="choice-card">
          <span class="choice-icon">🔍</span>
          <span class="choice-title">IK ZOEK</span>
          <span class="choice-sub">Vind een draagmiddel op maat van jouw baby.</span>
        </button>

        <button id="card-vergelijk" class="choice-card">
          <span class="choice-icon">⚖️</span>
          <span class="choice-title">IK VERGELIJK</span>
          <span class="choice-sub">Filter op kenmerken en vergelijk dragers.</span>
        </button>

      </div>

      <div class="nav-row">
        <button id="btn-back-3" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-3" class="btn btn-primary" disabled>VERDER</button>
      </div>

    </div>
  </section>

  <!-- SCHERM 4 + 5 laat ik weg om ruimte te besparen -->
</main>

<script>
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.body.classList.toggle("show-icon", id !== "screen-1" && id !== "screen-2");
}

document.getElementById("btn-next-1").onclick = () => show("screen-2");
document.getElementById("btn-back-2").onclick = () => show("screen-1");
document.getElementById("btn-next-2").onclick = () => show("screen-3");
document.getElementById("btn-back-3").onclick = () => show("screen-2");
</script>

</body>
</html>
