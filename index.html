<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draagkompas</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">

  <style>
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background:#0f0b3a;
      color:#fff;
      font-family: Montserrat, sans-serif;
    }

    :root{
      --floating-h:110px;
    }

    /* ICONEN */
    .floating-icon,
    .floating-text{
      position:absolute;
      top:20px;
      z-index:100;
      display:none;
    }
    .floating-icon{ left:20px; }
    .floating-text{ right:20px; }

    body.show-icon .floating-icon,
    body.show-icon .floating-text{ display:block; }

    .floating-icon img,
    .floating-text img{
      height:var(--floating-h);
      display:block;
    }

    /* SCHERMEN */
    .screen{
      display:none;
      min-height:100vh;
      padding:16px;
    }
    .active{ display:block; }

    /* Vanaf scherm 3 extra ruimte */
    #screen-3, #screen-4-zoek, #screen-4-vergelijk, #screen-5-results{
      padding-top:240px;
    }
    @media(max-width:720px){
      #screen-3, #screen-4-zoek, #screen-4-vergelijk, #screen-5-results{
        padding-top:280px;
      }
    }

    /* Buttons */
    .nav-row{
      display:flex;
      justify-content:space-between;
      margin-top:20px;
    }
    .btn{
      padding:14px 22px;
      border:none; border-radius:12px;
      font-weight:800; cursor:pointer;
    }
    .btn-primary{ background:#ff7a59; color:#1a1446; }
    .btn-secondary{ background:#2a246f; color:#fff; }

    /* SCHERM 1 */
    .screen1-wrapper{
      min-height:100vh;
      display:grid;
      place-items:center;
    }
    .intro-inner{
      display:grid; gap:24px; justify-items:center;
    }
    .intro-logo{ width:min(95%,1100px); }

.screen2-image {
  max-width: 100%;
  height: auto;
  display: block;
}

    /* SCHERM 3 */
    .choice-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }
    @media(max-width:700px){
      .choice-grid{ grid-template-columns:1fr; }
    }

    .choice-card{
      background:#15104a;
      border:1px solid rgba(255,255,255,0.2);
      padding:28px;
      border-radius:18px;
      cursor:pointer;
      display:grid; gap:12px;
    }
    .choice-icon{ font-size:40px; }
    .choice-title{ font-size:28px; font-weight:800; color:#fff; }
    .choice-sub{ color:#cfd3ff; }

  </style>
</head>

<body>

<main id="app">

  <!-- ICONEN -->
  <div class="floating-icon">
    <img src="assets/img/header-icon.png" alt="icon">
  </div>

  <div class="floating-text">
    <img src="assets/img/header-text.png" alt="text">
  </div>

  <!-- SCHERM 1 -->
  <section id="screen-1" class="screen active">
    <div class="screen1-wrapper">
      <div class="intro-inner">
        <img src="assets/img/logo.png" class="intro-logo" alt="logo">
        <div class="nav-row">
          <button id="btn-next-1" class="btn btn-primary">VERDER</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SCHERM 2 -->
  <section id="screen-2" class="screen">
    <div class="screen2-wrapper">
      <figure>
        <img src="assets/img/draagkompas-disclaimer.png" class="screen2-image" alt="disclaimer">
      </figure>
      <div class="nav-row">
        <button id="btn-back-2" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-2" class="btn btn-primary">VERDER</button>
      </div>
    </div>
  </section>

  <!-- SCHERM 3 -->
  <section id="screen-3" class="screen">
    <div class="screen3-wrapper">

      <div class="choice-grid">
        <button id="card-zoek" class="choice-card">
          <span class="choice-icon">🔍</span>
          <span class="choice-title">IK ZOEK</span>
          <span class="choice-sub">Vind een draagmiddel op maat van jouw baby.</span>
        </button>

        <button id="card-vergelijk" class="choice-card">
          <span class="choice-icon">⚖️</span>
          <span class="choice-title">IK VERGELIJK</span>
          <span class="choice-sub">Filter op kenmerken en vergelijk dragers.</span>
        </button>
      </div>

      <div class="nav-row">
        <button id="btn-back-3" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-3" class="btn btn-primary" disabled>VERDER</button>
      </div>

    </div>
  </section>

  <!-- SCHERM 4 + 5 laat ik weg voor nu -->
</main>

<script>
function show(id){
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  // iconen tonen vanaf scherm 3
  document.body.classList.toggle("show-icon", id !== "screen-1" && id !== "screen-2");
}

document.getElementById("btn-next-1").onclick = () => show("screen-2");
document.getElementById("btn-back-2").onclick = () => show("screen-1");
document.getElementById("btn-next-2").onclick = () => show("screen-3");
document.getElementById("btn-back-3").onclick = () => show("screen-2");

// keuze op scherm 3
document.getElementById("card-zoek").onclick = () => {
  document.getElementById("btn-next-3").disabled = false;
};
document.getElementById("card-vergelijk").onclick = () => {
  document.getElementById("btn-next-3").disabled = false;
};
</script>

</body>
</html>
