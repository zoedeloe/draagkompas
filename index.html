
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Draagkompas</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- ICONEN — standaard verborgen -->
<div id="header-icons" class="header-icons hidden">
  <img src="assets/img/header-icon.png" class="icon-left" alt="icon">
  <img src="assets/img/header-text.png" class="icon-right" alt="text">
</div>

<main>

  <!-- SCHERM 1 -->
  <section id="screen-1" class="screen active">
    <div class="center">
      <img src="assets/img/logo.png" class="intro-logo" alt="logo">
      <button id="go-2" class="btn btn-primary">VERDER</button>
    </div>
  </section>

  <!-- SCHERM 2 -->
  <section id="screen-2" class="screen">
    <div class="center">
      <img src="assets/img/draagkompas-disclaimer.png" class="disclaimer" alt="disclaimer">
      <div class="nav-row">
        <button id="back-1" class="btn btn-secondary">TERUG</button>
        <button id="go-3" class="btn btn-primary">VERDER</button>
      </div>
    </div>
  </section>

  <!-- SCHERM 3 -->
  <section id="screen-3" class="screen">
    <div class="choice-grid">

      <button class="choice-card" id="choose-zoek" data-target="screen-4-zoek">
        <span class="choice-icon">🔍</span>
        <span class="choice-title">IK ZOEK</span>
        <span class="choice-sub">Vind een draagmiddel op maat van jouw baby.</span>
      </button>

      <button class="choice-card" id="choose-vergelijk" data-target="screen-4-vergelijk">
        <span class="choice-icon">⚖️</span>
        <span class="choice-title">IK VERGELIJK</span>
        <span class="choice-sub">Filter op kenmerken en vergelijk dragers.</span>
      </button>

    </div>

    <div class="nav-row">
      <button id="back-2" class="btn btn-secondary">TERUG</button>
    </div>
  </section>

  <!-- SCHERM 4 — ZOEK -->
  <section id="screen-4-zoek" class="screen">
    <h2>Zoekmodule</h2>
    <p>Hier komt jouw zoekmodule.</p>

    <div class="nav-row">
      <button data-target="screen-3" class="btn btn-secondary go-back">TERUG</button>
    </div>
  </section>

  <!-- SCHERM 4 — VERGELIJK -->
  <section id="screen-4-vergelijk" class="screen">
    <h2>Vergelijkmodule</h2>
    <p>Hier komt jouw vergelijkmodule.</p>

    <div class="nav-row">
      <button data-target="screen-3" class="btn btn-secondary go-back">TERUG</button>
    </div>
  </section>

</main>

<script>
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  const header = document.getElementById("header-icons");

  // iconen enkel vanaf scherm 3
  if (id === "screen-3" || id === "screen-4-zoek" || id === "screen-4-vergelijk") {
    header.classList.remove("hidden");
  } else {
    header.classList.add("hidden");
  }
}

// Navigatie scherm 1 -> 2
document.getElementById("go-2").onclick = () => show("screen-2");
document.getElementById("back-1").onclick = () => show("screen-1");

// Scherm 2 -> 3
document.getElementById("go-3").onclick = () => show("screen-3");
document.getElementById("back-2").onclick = () => show("screen-2");

// Scherm 3 klikken op keuze → direct naar doel-scherm
document.getElementById("choose-zoek").onclick = () => show("screen-4-zoek");
document.getElementById("choose-vergelijk").onclick = () => show("screen-4-vergelijk");

// terug van scherm 4 naar scherm 3
document.querySelectorAll(".go-back").forEach(btn => {
  btn.onclick = () => show(btn.dataset.target);
});
</script>

</body>
</html>
