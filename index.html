
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draagkompas</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">

  <style>
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background:#0f0b3a;
      color:#fff;
      font-family: Montserrat, system-ui, sans-serif;
    }

    :root{
      --floating-h:110px;
      --line:rgba(255,255,255,0.15);
      --muted:#cfd3ff;
      --card:#15104a;
      --panel:#1b165c;
      --accent:#ff7a59;
      --accent-ink:#1a1446;
    }

    /* ICONEN */
    .floating-icon,
    .floating-text{
      position:absolute;
      top:20px;
      z-index:100;
      display:none;
    }
    .floating-icon{ left:20px; }
    .floating-text{ right:20px; }

    body.show-icon .floating-icon,
    body.show-icon .floating-text{
      display:block;
    }

    .floating-icon img,
    .floating-text img{
      height:var(--floating-h);
      width:auto;
      display:block;
    }

    /* SCHERMEN */
    .screen{
      display:none;
      min-height:100svh;
      padding:16px;
    }
    .screen.active{ display:block; }

    /* Vanaf scherm 3 ruimte bovenaan */
    #screen-3,
    #screen-4-zoek,
    #screen-4-vergelijk,
    #screen-5-results{
      padding-top:150px !important;
    }
    @media(max-width:720px){
      #screen-3,
      #screen-4-zoek,
      #screen-4-vergelijk,
      #screen-5-results{
        padding-top:180px !important;
      }
    }

    /* Buttons */
    .nav-row{
      display:flex; gap:12px; justify-content:space-between;
      margin-top:12px;
    }
    .btn{
      border:none; padding:14px 22px; border-radius:12px;
      font-weight:800; cursor:pointer; font-family:inherit;
    }
    .btn-primary{ background:var(--accent); color:var(--accent-ink); }
    .btn-secondary{ background:#2a246f; color:#fff; }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; }

    /* SCHERM 1 */
    #btn-back-1{ display:none!important; }
    .screen1-wrapper{
      display:grid; place-items:center;
      min-height:100svh;
    }
    .intro-inner{
      display:grid; gap:24px; justify-items:center;
      max-width:1100px;
    }
    .intro-logo{ width:min(95%,1100px); height:auto; }

    /* SCHERM 2 */
    .screen2-wrapper{
      max-width:1100px; margin:0 auto;
      display:grid; gap:20px;
    }
    .screen2-image{
      width:100%;
      border-radius:12px;
      box-shadow:0 8px 28px rgba(0,0,0,.35);
    }

    /* SCHERM 3 */
    .screen3-wrapper{
      max-width:1100px; margin:0 auto;
      display:grid; gap:28px;
    }
    .choice-grid{
      display:grid; gap:20px;
      grid-template-columns:repeat(2,1fr);
    }
    @media(max-width:700px){
      .choice-grid{ grid-template-columns:1fr; }
    }
    .choice-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:28px;
      display:grid; gap:18px;
      cursor:pointer;
    }
    .choice-icon{ font-size:40px; }
    .choice-title{
      font-size:28px;
      font-weight:800;
      color:#fff;
    }
    .choice-sub{ color:var(--muted); }

    /* SCHERM 4 */
    .filters-wrapper{
      max-width:1100px; margin:0 auto;
      display:grid; gap:20px;
    }
    .filters-section{ display:grid; gap:16px; }

    .group{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
    }
    .group-header{
      display:flex; justify-content:space-between;
      margin-bottom:10px;
    }
    .group-title{ font-weight:800; }
    .badge{
      border:1px solid var(--line);
      padding:2px 6px;
      border-radius:999px;
      font-size:11px;
      color:var(--muted);
    }

    /* SCHERM 5 */
    .results-wrapper{
      max-width:900px; margin:0 auto;
      display:grid; gap:16px;
    }
    .results-summary{
      background:#201a6b;
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
    }
  </style>
</head>


<body>

<main id="app">

  <!-- ICONEN -->
  <div class="floating-icon">
    assets/img/header-icon.png
  </div>

  <div class="floating-text">
    assets/img/header-text.png
  </div>

  <!-- SCHERM 1 -->
  <section id="screen-1" class="screen active">
    <div class="screen1-wrapper">
      <div class="intro-inner">
        assets/img/logo.png
        <div class="nav-row">
          <button id="btn-back-1" class="btn btn-secondary">TERUG</button>
          <button id="btn-next-1" class="btn btn-primary">VERDER</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SCHERM 2 -->
  <section id="screen-2" class="screen">
    <div class="screen2-wrapper">
      <figure>
        assets/img/draagkompas-disclaimer.png
      </figure>
      <div class="nav-row">
        <button id="btn-back-2" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-2" class="btn btn-primary">VERDER</button>
      </div>
    </div>
  </section>

  <!-- SCHERM 3 -->
  <section id="screen-3" class="screen">
    <div class="screen3-wrapper">

      <div class="choice-grid">

        <button id="card-zoek" class="choice-card">
          <span class="choice-icon">🔍</span>
          <span class="choice-title">IK ZOEK</span>
          <span class="choice-sub">Vind een draagmiddel op maat van jouw baby.</span>
        </button>

        <button id="card-vergelijk" class="choice-card">
          <span class="choice-icon">⚖️</span>
          <span class="choice-title">IK VERGELIJK</span>
          <span class="choice-sub">Filter op kenmerken en vergelijk dragers.</span>
        </button>

      </div>

      <div class="nav-row">
        <button id="btn-back-3" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-3" class="btn btn-primary" disabled>VERDER</button>
      </div>

    </div>
  </section>

  <!-- SCHERM 4A -->
  <section id="screen-4-zoek" class="screen">
    <div class="filters-wrapper">

      <div class="filters-head">BASIS zichtbaar; UITGEBREID/EXPERT grijs</div>

      <div id="filters-zoek-basic" class="filters-section"></div>

      <div class="filters-more">
        <button id="toggle-more-zoek" class="btn" aria-expanded="false">MEER FILTERS</button>
        <div id="filters-zoek-more" class="more-panel" hidden></div>
      </div>

      <div class="nav-row">
        <button id="btn-back-4-zoek" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-4-zoek" class="btn btn-primary">VERDER</button>
      </div>

    </div>
  </section>

  <!-- SCHERM 4B -->
  <section id="screen-4-vergelijk" class="screen">
    <div class="filters-wrapper">

      <div class="filters-head">BASIS + UITGEBREID actief; EXPERT grijs</div>

      <div id="filters-vergelijk-basic" class="filters-section"></div>

      <div class="filters-more">
        <button id="toggle-more-vergelijk" class="btn" aria-expanded="false">MEER FILTERS</button>
        <div id="filters-vergelijk-more" class="more-panel" hidden></div>
      </div>

      <div class="nav-row">
        <button id="btn-back-4-vergelijk" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-4-vergelijk" class="btn btn-primary">VERDER</button>
      </div>

    </div>
  </section>

  <!-- SCHERM 5 -->
  <section id="screen-5-results" class="screen">
    <div class="results-wrapper">

      <h2>RESULTATEN</h2>
      <pre id="selected-filters" class="results-summary">Nog geen filters geselecteerd.</pre>

      <div class="nav-row">
        <button id="btn-back-5" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-5" class="btn btn-primary" disabled>VERDER</button>
      </div>

    </div>
  </section>

</main>


<script>
const GOOGLE_SHEET_ID="16F_daQjGcgkKeXGJeynj0VNBePvcsiWrdj7n3xlMsto";

async function fetchGVizJSON(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheet}&_=${Date.now()}`;
  const r=await fetch(url); const t=await r.text();
  const m=t.match(/setResponse\(([\s\S]*?)\);/); const j=JSON.parse(m[1]);
  const h=j.table.cols.map(c=>c.label);
  const rows=j.table.rows.map(r=>r.c.map(c=>c?c.v:""));
  return {headers:h, rows};
}

function mapIndex(h){ return Object.fromEntries(h.map((x,i)=>[x.toLowerCase(),i])); }

function mapGroups(s){
  const i=mapIndex(s.headers);
  return s.rows.map(r=>({id:r[i.id],label:r[i.label],order:+r[i.order]}))
               .sort((a,b)=>a.order-b.order);
}

function mapFields(s){
  const i=mapIndex(s.headers);
  return s.rows.map(r=>({
    id:r[i.id], label:r[i.label], group:r[i.group],
    layer:r[i.layer], type:r[i.type],
    options:(r[i.options]||"").split("|").map(s=>s.trim()).filter(Boolean),
    tooltip:r[i.tooltip]||"",
    order:+r[i.order]
  })).sort((a,b)=>a.order-b.order);
}

const SCREENS=[
  "screen-1","screen-2","screen-3",
  "screen-4-zoek","screen-4-vergelijk",
  "screen-5-results"
];
let lastChoice=null;
let FILTERS={groups:[],fields:[]};

function goTo(id){
  SCREENS.forEach(s=>document.getElementById(s).classList.toggle("active",s===id));
  updateIcons();
  updateNav();
}

function updateIcons(){
  const i=SCREENS.findIndex(s=>document.getElementById(s).classList.contains("active"));
  if(i>=2) document.body.classList.add("show-icon");
  else document.body.classList.remove("show-icon");
}

function updateNav(){
  const b=document.getElementById("btn-next-3");
  if(b) b.disabled=!lastChoice;
}

function layerOK(l,p){ return l==="basis" || (l==="uitgebreid" && p==="vergelijk"); }

function createField(f,path){
  const ok=layerOK(f.layer,path);
  const wrap=document.createElement("div");
  wrap.className="field"+(ok?"":" is-disabled");

  const lbl=document.createElement("div");
  lbl.className="field-label";
  lbl.textContent=f.label;
  wrap.appendChild(lbl);

  const ctr=document.createElement("div");
  ctr.className="field-controls";

  function dis(e){ if(!ok) e.disabled=true; }

  if(f.type==="chips"){
    const box=document.createElement("div"); box.className="chips";
    f.options.forEach(o=>{
      const b=document.createElement("button");
      b.className="chip"; b.textContent=o; b.type="button";
      b.setAttribute("aria-pressed","false");
      if(ok){
        b.onclick=()=>b.setAttribute("aria-pressed",
          b.getAttribute("aria-pressed")==="true"?"false":"true");
      }
      box.appendChild(b);
    });
    ctr.appendChild(box);
  }

  else if(f.type==="select"){
    const s=document.createElement("select");
    f.options.forEach(o=>{
      const op=document.createElement("option");
      op.value=o; op.textContent=o; s.appendChild(op);
    });
    dis(s); ctr.appendChild(s);
  }

  else if(f.type==="toggle"){
    const lb=document.createElement("label");
    const i=document.createElement("input");
    i.type="checkbox"; dis(i);
    lb.appendChild(i); lb.append(" JA/NEE");
    ctr.appendChild(lb);
  }

  else if(f.type==="number"){
    const i=document.createElement("input");
    i.type="number"; dis(i); ctr.appendChild(i);
  }

  else{
    const i=document.createElement("input");
    i.type="text"; dis(i); ctr.appendChild(i);
  }

  wrap.appendChild(ctr);
  return wrap;
}

function renderFilters(path){
  const basic=document.getElementById(`filters-${path}-basic`);
  const more=document.getElementById(`filters-${path}-more`);
  basic.innerHTML=""; more.innerHTML="";

  FILTERS.groups.forEach(g=>{
    const fs=FILTERS.fields.filter(f=>f.group===g.id);
    const fb=fs.filter(f=>f.layer==="basis");
    const fo=fs.filter(f=>f.layer!=="basis");

    if(fb.length){
      const sec=document.createElement("section");
      sec.className="group";
      sec.innerHTML=`<div class="group-header">
        <div class="group-title">${g.label}</div>
        <div class="badge">BASIS</div></div>`;
      fb.forEach(f=>sec.appendChild(createField(f,path)));
      basic.appendChild(sec);
    }

    if(fo.length){
      const sec=document.createElement("section");
      sec.className="group";

      const hasU=fo.some(f=>f.layer==="uitgebreid");
      const hasE=fo.some(f=>f.layer==="expert");

      sec.innerHTML=`<div class="group-header">
        <div class="group-title">${g.label}</div>
        <div class="badges">
          ${hasU?'<span class="badge">UITGEBREID</span>':''}
          ${hasE?'<span class="badge">EXPERT</span>':''}
        </div></div>`;

      fo.forEach(f=>sec.appendChild(createField(f,path)));
      more.appendChild(sec);
    }
  });
}

document.addEventListener("DOMContentLoaded", async()=>{

  document.getElementById("btn-next-1").onclick=()=>goTo("screen-2");
  document.getElementById("btn-back-2").onclick=()=>goTo("screen-1");
  document.getElementById("btn-next-2").onclick=()=>goTo("screen-3");

  document.getElementById("btn-back-3").onclick=()=>goTo("screen-2");

  document.getElementById("card-zoek").onclick=()=>{
    lastChoice="zoek"; updateNav(); renderFilters("zoek"); goTo("screen-4-zoek");
  };

  document.getElementById("card-vergelijk").onclick=()=>{
    lastChoice="vergelijk"; updateNav(); renderFilters("vergelijk"); goTo("screen-4-vergelijk");
  };

  document.getElementById("btn-next-3").onclick=()=>{
    if(lastChoice==="zoek") goTo("screen-4-zoek");
    else goTo("screen-4-vergelijk");
  };

  document.getElementById("toggle-more-zoek").onclick=e=>{
    const tg=document.getElementById("filters-zoek-more");
    tg.hidden=e.target.getAttribute("aria-expanded")==="true";
    e.target.setAttribute("aria-expanded",
      tg.hidden?"false":"true");
  };

  document.getElementById("toggle-more-vergelijk").onclick=e=>{
    const tg=document.getElementById("filters-vergelijk-more");
    tg.hidden=e.target.getAttribute("aria-expanded")==="true";
    e.target.setAttribute("aria-expanded",
      tg.hidden?"false":"true");
  };

  document.getElementById("btn-back-4-zoek").onclick=()=>goTo("screen-3");
  document.getElementById("btn-back-4-vergelijk").onclick=()=>goTo("screen-3");

  document.getElementById("btn-next-4-zoek").onclick=()=>{
    document.getElementById("selected-filters").textContent="Gekozen pad: IK ZOEK";
    goTo("screen-5-results");
  };

  document.getElementById("btn-next-4-vergelijk").onclick=()=>{
    document.getElementById("selected-filters").textContent="Gekozen pad: IK VERGELIJK";
    goTo("screen-5-results");
  };

  document.getElementById("btn-back-5").onclick=()=>{
    if(lastChoice==="zoek") goTo("screen-4-zoek");
    else goTo("screen-4-vergelijk");
  };

  try{
    const[g,f]=await Promise.all([
      fetchGVizJSON("groups"),
      fetchGVizJSON("fields")
    ]);
    FILTERS.groups=mapGroups(g);
    FILTERS.fields=mapFields(f);
  }catch(e){ console.error(e); }

  updateIcons();
  updateNav();
});
</script>

</body>
</html>
