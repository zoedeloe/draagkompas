<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draagkompas</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header id="app-header" class="hidden">
  <img src="assets/img/header-icon.png" class="logo-img" alt="icoon">
  <img src="assets/img/header-text.png" class="logo-img" alt="tekst">
</header>

<main class="app">

  <!-- SCHERM 1 — Intro -->
  <section id="screen-1" class="screen active">
    <div class="screen1-wrapper">
      <div class="intro-inner">
        <img src="assets/img/logo.png" class="intro-logo" alt="logo">
        <div class="nav-row">
          <button id="btn-next-1" class="btn btn-primary">VERDER</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SCHERM 2 — Disclaimer -->
  <section id="screen-2" class="screen">
    <div class="screen2-wrapper">
      <figure class="disclaimer-figure">
        <img src="assets/img/draagkompas-disclaimer.png" class="screen2-image" alt="disclaimer">
      </figure>
      <div class="nav-row">
        <button id="btn-back-2" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-2" class="btn btn-primary">VERDER</button>
      </div>
    </div>
  </section>

  <!-- SCHERM 3 — Keuze -->
  <section id="screen-3" class="screen">
    <div class="screen3-wrapper">

      <div class="choice-grid">
        <button id="card-zoek" class="choice-card" data-choice="zoek">
          <span class="choice-icon">🔍</span>
          <span class="choice-title">IK ZOEK</span>
          <span class="choice-sub">Vind een draagmiddel op maat van jouw baby.</span>
        </button>

        <button id="card-vergelijk" class="choice-card" data-choice="vergelijk">
          <span class="choice-icon">⚖️</span>
          <span class="choice-title">IK VERGELIJK</span>
          <span class="choice-sub">Filter op kenmerken en vergelijk dragers.</span>
        </button>
      </div>

      <div class="nav-row">
        <button id="btn-back-3" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-3" class="btn btn-primary" disabled>VERDER</button>
      </div>

    </div>
  </section>

  <!-- SCHERM 4 — FILTER (IK ZOEK / IK VERGELIJK) -->
  <section id="screen-4" class="screen">
    <div class="filters-wrapper">

      <div class="filters-head">
        <h2>Filter jouw draagmiddel</h2>
      </div>

      <div class="filters-section">

        <div class="group">
          <div class="group-header">
            <span class="group-title">Leeftijd / gewicht</span>
          </div>
          <div class="field">
            <label class="field-label">Leeftijd</label>
            <select id="filter-age">
              <option value="">Alle leeftijden</option>
              <option>0–3 maanden</option>
              <option>3–9 maanden</option>
              <option>9–24 maanden</option>
            </select>
          </div>
        </div>

        <div class="group">
          <div class="group-header">
            <span class="group-title">Type drager</span>
          </div>
          <div class="chips">
            <span class="chip" data-type="rekbaar">Rekbare doek</span>
            <span class="chip" data-type="geweven">Geweven doek</span>
            <span class="chip" data-type="mei-tai">Mei Tai</span>
            <span class="chip" data-type="ssc">Ergonomische drager</span>
          </div>
        </div>

        <div class="group">
          <div class="group-header">
            <span class="group-title">Kenmerken</span>
          </div>
          <div class="field-controls">
            <label class="toggle"><input type="checkbox"> Snel aan te doen</label>
            <label class="toggle"><input type="checkbox"> Past meerdere maten</label>
            <label class="toggle"><input type="checkbox"> Budgetvriendelijk</label>
          </div>
        </div>

      </div>

      <div class="nav-row">
        <button id="btn-back-4" class="btn btn-secondary">TERUG</button>
      </div>

    </div>
  </section>

</main>

<script>
let keuze = null;

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  // iconen tonen vanaf scherm 3
  document.getElementById("app-header").classList.toggle("hidden", id === "screen-1" || id === "screen-2");
}

document.getElementById("btn-next-1").onclick = () => show("screen-2");
document.getElementById("btn-back-2").onclick = () => show("screen-1");
document.getElementById("btn-next-2").onclick = () => show("screen-3");
document.getElementById("btn-back-3").onclick = () => show("screen-2");

document.querySelectorAll(".choice-card").forEach(card => {
  card.addEventListener("click", () => {
    keuze = card.dataset.choice;
    document.getElementById("btn-next-3").disabled = false;
    document.querySelectorAll(".choice-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
  });
});

document.getElementById("btn-next-3").onclick = () => show("screen-4");
document.getElementById("btn-back-4").onclick = () => show("screen-3");
</script>

</body>
</html>
