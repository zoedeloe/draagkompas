
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draagkompas</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main id="app">

  <!-- ICONEN -->
  <div class="floating-icon">
    <img src="assets/img/header-icon.png" alt="icon">
  </div>

  <div class="floating-text">
    <img src="assets/img/header-text.png" alt="text">
  </div>

  <!-- SCHERM 1 -->
  <section id="screen-1" class="screen active">
    <div class="screen1-wrapper">
      <div class="intro-inner">
        <img src="assets/img/logo.png" class="intro-logo" alt="logo">
        <div class="nav-row">
          <button id="btn-next-1" class="btn btn-primary">VERDER</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SCHERM 2 -->
  <section id="screen-2" class="screen">
    <div class="screen2-wrapper">
      <figure>
        <img src="assets/img/draagkompas-disclaimer.png" class="screen2-image" alt="disclaimer">
      </figure>
      <div class="nav-row">
        <button id="btn-back-2" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-2" class="btn btn-primary">VERDER</button>
      </div>
    </div>
  </section>

  <!-- SCHERM 3 -->
  <section id="screen-3" class="screen">
    <div class="screen3-wrapper">

      <div class="choice-grid">
        <button id="card-zoek" class="choice-card" data-choice="zoek">
          <span class="choice-icon">🔍</span>
          <span class="choice-title">IK ZOEK</span>
          <span class="choice-sub">Vind een draagmiddel op maat van jouw baby.</span>
        </button>

        <button id="card-vergelijk" class="choice-card" data-choice="vergelijk">
          <span class="choice-icon">⚖️</span>
          <span class="choice-title">IK VERGELIJK</span>
          <span class="choice-sub">Filter op kenmerken en vergelijk dragers.</span>
        </button>
      </div>

      <div class="nav-row">
        <button id="btn-back-3" class="btn btn-secondary">TERUG</button>
        <button id="btn-next-3" class="btn btn-primary" disabled>VERDER</button>
      </div>

    </div>
  </section>

  <!-- SCHERM 4 – ZOEK -->
  <section id="screen-4-zoek" class="screen">
    <h2>Zoekmodule</h2>
    <p>Hier komt jouw zoekmodule.</p>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="show('screen-3')">TERUG</button>
    </div>
  </section>

  <!-- SCHERM 4 – VERGELIJK -->
  <section id="screen-4-vergelijk" class="screen">
    <h2>Vergelijkmodule</h2>
    <p>Hier komt jouw vergelijkmodule.</p>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="show('screen-3')">TERUG</button>
    </div>
  </section>

</main>

<script>
let keuze = null;

function show(id){
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  // iconen tonen vanaf scherm 3
  document.body.classList.toggle("show-icon", id !== "screen-1" && id !== "screen-2");
}

document.getElementById("btn-next-1").onclick = () => show("screen-2");
document.getElementById("btn-back-2").onclick = () => show("screen-1");
document.getElementById("btn-next-2").onclick = () => show("screen-3");
document.getElementById("btn-back-3").onclick = () => show("screen-2");

// keuze op scherm 3
document.querySelectorAll(".choice-card").forEach(card => {
  card.addEventListener("click", () => {
    keuze = card.dataset.choice;
    document.getElementById("btn-next-3").disabled = false;

    // active styling
    document.querySelectorAll(".choice-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
  });
});

// verder op scherm 3
document.getElementById("btn-next-3").onclick = () => {
  if(keuze === "zoek") show("screen-4-zoek");
  if(keuze === "vergelijk") show("screen-4-vergelijk");
};
</script>

</body>
</html>
